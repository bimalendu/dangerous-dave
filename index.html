<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dangerous Dave Reimagined</title>
<style>
  html, body { margin: 0; height: 100%; background: #07060c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw, 160vh); aspect-ratio: 16 / 10; }
  #screen { width: 100%; height: 100%; display: block; border-radius: 6px; box-shadow: 0 0 80px rgba(120, 70, 255, 0.18); }
  #paused { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font: 800 5vmin "Avenir Next", "Segoe UI", Arial, sans-serif; letter-spacing: 0.3em; color: #fff;
    background: rgba(6, 5, 12, 0.6); border-radius: 6px; }
  #err { position: absolute; left: 8px; bottom: 8px; display: none; padding: 6px 10px; border-radius: 4px;
    font: 12px ui-monospace, Menlo, monospace; color: #fff; background: #a3122a; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen"></canvas>
  <div id="paused">PAUSED</div>
  <div id="err"></div>
</div>
<script src="js/levels.js"></script>
<script src="js/world.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
<script src="js/input.js"></script>
<script src="js/sprites.js"></script>
<script src="js/shaders.js"></script>
<script src="js/audio.js"></script>
<script src="js/renderer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
